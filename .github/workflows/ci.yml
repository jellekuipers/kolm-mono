name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs Vite+, Node and the pinned pnpm, and caches the pnpm store.
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      # Generate the Prisma client, then check, test and build every package.
      - run: vp run ready

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run e2e:install --with-deps
      # Starts `vp run dev` with the default env (no database, auth off) and runs the smoke tests.
      - run: vp run e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: apps/e2e/test-results/
